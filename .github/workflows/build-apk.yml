name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Show project files
        run: ls -la android android/app

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Install Android parts
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - name: Build the app
        working-directory: android
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Sign the app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Missing secret ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > masroofy.keystore
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks masroofy.keystore --ks-key-alias masroofy \
            --ks-pass pass:Masroofy2026 --key-pass pass:Masroofy2026 \
            --out Masroofy.apk aligned.apk
          "$BT/apksigner" verify --print-certs Masroofy.apk
          jarsigner -keystore masroofy.keystore -storepass Masroofy2026 -keypass Masroofy2026 \
            -signedjar Masroofy.aab android/app/build/outputs/bundle/release/app-release.aab masroofy
          rm masroofy.keystore

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Masroofy-APK
          path: |
            Masroofy.apk
            Masroofy.aab
