name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build the app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Sign the app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Missing secret ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > masroofy.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks masroofy.keystore --ks-key-alias masroofy \
            --ks-pass pass:Masroofy2026 --key-pass pass:Masroofy2026 \
            --out Masroofy.apk aligned.apk
          "$BT/apksigner" verify --print-certs Masroofy.apk
          jarsigner -keystore masroofy.keystore -storepass Masroofy2026 -keypass Masroofy2026 \
            -signedjar Masroofy.aab android/app/build/outputs/bundle/release/app-release.aab masroofy
          rm masroofy.keystore

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Masroofy-APK
          path: |
            Masroofy.apk
            Masroofy.aab
